<aside class="cxg-card" aria-label="Your files never leave your device">

      <linearGradient id="cxgBgGDark" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#1a112f" />

        <stop offset=".72" stop-color="#100921" />

      <radialGradient id="cxgHazeG" cx=".5" cy=".5" r=".5">
        <stop stop-color="#8b5cf6" stop-opacity=".24" />
        <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
      </radialGradient>
    </defs>
    <rect width="560" height="420" fill="url(#cxgBgG)" />
    <!-- wave 1: top-right sweep -->
    <path d="M560 0v190c-78-10-152-44-206-92C310 62 300 26 296 0z" fill="url(#cxgWaveG)" opacity=".40" />
    <!-- wave 2: left / bottom sweep -->

    <path d="M0 168c74 8 148 2 212-20 58-20 92-52 108-92-58 30-140 46-208 40C60 92 24 74 0 54z"
          fill="url(#cxgWaveG)" opacity=".26" />
    <!-- soft haze: glass chips ke peechay colour, taake frosting saaf dikhe -->
    <ellipse cx="120" cy="46" rx="150" ry="86" fill="url(#cxgHazeG)" />
    <ellipse cx="150" cy="300" rx="164" ry="92" fill="url(#cxgHazeG)" />

        <!-- ambient shadow (filter ke baghair) -->

        <!-- platform glow -->
        <ellipse cx="120" cy="206" rx="96" ry="30" fill="url(#cxgPlateG)" />

          <ellipse cx="120" cy="206" rx="38" ry="9" stroke-opacity=".28" stroke-width="1.1" />

        <!-- orbit ring: back half (soft outer glow + core stroke) -->
        <g transform="rotate(-16 120 132)">

                   stroke-opacity=".42" stroke-width="5.5" />
          <ellipse cx="120" cy="132" rx="116" ry="56" stroke="url(#cxgOrbitG)"
                   stroke-opacity="1" stroke-width="1.9" />
        </g>

        <!-- shield -->
        <g>
          <path d="M120 26c23 15 46 21 69 24v55c0 47-32 78-69 93-37-15-69-46-69-93V50c23-3 46-9 69-24z"
                fill="url(#cxgShieldG)" />
          <path d="M120 40c17 11 34 16 51 19v46c0 38-25 63-51 76-26-13-51-38-51-76V59c17-3 34-8 51-19z"
                fill="url(#cxgGlossG)" />
          <path d="M178 62v43c0 33-16 56-40 72" stroke="url(#cxgRimG)" stroke-width="3.2"
                stroke-linecap="round" fill="none" />
          <!-- lock plate -->
          <rect x="86" y="112" width="68" height="60" rx="15" fill="url(#cxgLockG)" />
          <rect x="86" y="112" width="68" height="60" rx="15" stroke="#fff" stroke-opacity=".7" stroke-width="1.4" />
          <path d="M105 112v-13a15 15 0 0 1 30 0v13" stroke="#fff" stroke-width="8" stroke-linecap="round" />
          <circle cx="120" cy="136" r="7.5" fill="url(#cxgKeyG)" />
          <rect x="116.8" y="140" width="6.4" height="14" rx="3.2" fill="url(#cxgKeyG)" />
        </g>

        <!-- orbit ring: front arc (over the shield) -->
        <g transform="rotate(-16 120 132)">
          <path d="M236 133a116 56 0 0 1-116 56" stroke="#c4b5fd" stroke-opacity=".45"
                stroke-width="5.5" stroke-linecap="round" fill="none" />
          <path d="M236 133a116 56 0 0 1-116 56" stroke="url(#cxgOrbitG)" stroke-width="2.2"
                stroke-linecap="round" fill="none" />
        </g>
      </svg>
    </div>
  </div>

<style>
/* ---------- font: sab kuch site font inherit kare (no serif) ---------- */
.cxg-card,
.cxg-card *{
  font-family:inherit;
  -webkit-font-smoothing:antialiased;
}
.cxg-card{
  font-family:var(--font-sans, var(--font-inter, "Inter", "Outfit",
      system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif));

  container-type:inline-size;

  position:relative;
  isolation:isolate;
  width:100%;
  max-width:470px;
  margin-left:auto;
  padding:18px;
  border-radius:26px;
  border:1px solid rgba(255,255,255,.85);
  background:#fff;
  overflow:hidden;
  contain:layout style paint;   /* card ke andar ka paint bahar leak na kare */
  box-shadow:
    0 30px 70px -34px rgba(88,28,190,.42),
    0 2px 8px rgba(60,36,120,.05);
}
@media (hover:hover) and (pointer:fine){
  .cxg-card{transition:transform .4s ease, box-shadow .4s ease}
  .cxg-card:hover{
    transform:translateY(-2px);
    box-shadow:0 40px 84px -36px rgba(88,28,190,.52), 0 2px 10px rgba(60,36,120,.06);
  }
}

/* ---------- background waves ---------- */
.cxg-bg{
  position:absolute;inset:0;width:100%;height:100%;
  z-index:0;pointer-events:none;
}

/* ---------- connectors ---------- */
.cxg-wires{
  position:absolute;
  left:18px;right:18px;top:18px;
  height:calc(100% - 18px - 150px);  /* card padding + tabbar + pills */
  width:calc(100% - 36px);
  z-index:1;pointer-events:none;overflow:visible;
  fill:none;
  stroke:#7c3aed;
  stroke-opacity:.5;
  stroke-width:1.4;
  stroke-dasharray:2 4;
  stroke-linecap:round;
  vector-effect:non-scaling-stroke;
}

/* ---------- layout ---------- */
.cxg-row{
  position:relative;z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.cxg-row-top{margin-bottom:2px}
.cxg-row-bot{margin-top:2px;align-items:center;gap:10px}

.cxg-mid{
  position:relative;z-index:2;
  display:flex;align-items:center;justify-content:center;
  padding:6px 0 2px;
}
.cxg-art{
  width:clamp(190px, 52cqw, 250px);
  /* NOTE: filter:drop-shadow jaan bujh kar nahi hai — wo animating element par
     har frame re-rasterize hota hai. Shadow SVG ke andar soft ellipse se aa rahi hai. */
}
.cxg-art-svg{display:block;width:100%;height:auto}

/* ---------- chips ---------- */
.cxg-chip{
  position:relative;
  overflow:hidden;
  cursor:pointer;
  -webkit-tap-highlight-color:rgba(124,58,237,.18);
  -webkit-user-drag:none;
  -webkit-touch-callout:none;
  flex:1 1 0;
  min-width:0;
  max-width:190px;
  height:clamp(50px, 12.6cqw, 58px);
  box-sizing:border-box;
  display:flex;align-items:center;
  gap:clamp(6px, 1.6cqw, 9px);
  padding:0 clamp(8px, 2.1cqw, 12px);
  border-radius:18px;
  text-decoration:none;
  background:linear-gradient(135deg, rgba(255,255,255,.62) 0%, rgba(255,255,255,.4) 100%);
  -webkit-backdrop-filter:blur(16px) saturate(180%);
  backdrop-filter:blur(16px) saturate(180%);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:
    0 10px 28px rgba(124,58,237,.14),
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 -1px 0 rgba(124,58,237,.07);
  transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease, background .25s ease;
}
/* sheen: glass ki upar wali chamak */
.cxg-chip::before{
  content:"";
  position:absolute;inset:0;
  border-radius:inherit;
  background:linear-gradient(150deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.12) 42%, rgba(255,255,255,0) 62%);
  pointer-events:none;
}
.cxg-chip:hover,
.cxg-chip:focus-visible{
  transform:translateY(-2px);
  background:linear-gradient(135deg, rgba(255,255,255,.78) 0%, rgba(255,255,255,.56) 100%);
  border-color:rgba(255,255,255,1);
  box-shadow:0 16px 36px rgba(124,58,237,.24);
  outline:none;
}
.cxg-chip:focus-visible{box-shadow:0 0 0 3px rgba(124,58,237,.35), 0 16px 36px rgba(124,58,237,.2)}

/* highlight jab tab bar us tool par ho */
.cxg-chip.is-lit{
  border-color:rgba(196,181,253,.95);
  background:linear-gradient(135deg, rgba(255,255,255,.8) 0%, rgba(245,240,255,.6) 100%);
  box-shadow:0 14px 34px rgba(124,58,237,.28), 0 0 0 1px rgba(139,92,246,.28) inset;
}
.cxg-chip.is-lit .cxg-tile{
  pointer-events:none;background:#ddd0ff;color:#5b21b6}

.cxg-tile{
  pointer-events:none;
  flex:none;
  width:clamp(26px, 8.4cqw, 40px);
  height:clamp(26px, 8.4cqw, 40px);
  border-radius:clamp(8px, 2.6cqw, 12px);
  display:grid;place-items:center;
  background:linear-gradient(135deg, rgba(237,233,254,.98), rgba(221,214,254,.9));
  color:#6d28d9;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
  transition:background .25s ease, color .25s ease;
}
.cxg-tile svg{
  width:clamp(14px, 4.4cqw, 21px);
  height:clamp(14px, 4.4cqw, 21px);
}

.cxg-sep{
  pointer-events:none;
  flex:none;
  width:1px;
  height:46%;
  background:linear-gradient(180deg, rgba(124,58,237,0), rgba(124,58,237,.38), rgba(124,58,237,0));
}

.cxg-lb{
  pointer-events:none;          /* label par click bhi <a> hi khole */
  min-width:0;
  display:flex;flex-direction:column;gap:clamp(3px, .9cqw, 5px);
  font-size:clamp(10.5px, 3.05cqw, 13px);
  font-weight:700;
  line-height:1.12;
  color:#1c1630;
  letter-spacing:-.01em;
  white-space:nowrap;
  overflow:hidden;
}
.cxg-lb i{
  display:block;
  width:clamp(16px, 5.4cqw, 22px);
  height:3px;
  border-radius:2px;
  background:linear-gradient(90deg,#8b5cf6,#c084fc);
}

/* ---------- tab bar ---------- */
.cxg-tabs{
  position:relative;z-index:3;
  display:flex;
  gap:2px;
  margin-top:14px;
  padding:5px;
  border-radius:18px;
  background:rgba(255,255,255,.58);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 10px 28px rgba(124,58,237,.12), inset 0 1px 0 rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(14px) saturate(170%);
  backdrop-filter:blur(14px) saturate(170%);
}
.cxg-tab{
  position:relative;
  cursor:pointer;
  -webkit-tap-highlight-color:rgba(124,58,237,.18);
  -webkit-user-drag:none;
  flex:1 1 0;
  min-width:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;
  padding:8px 4px 9px;
  border-radius:14px;
  text-decoration:none;
  color:#4b4360;
  transition:background .22s ease, color .22s ease, box-shadow .22s ease;
}
/* hairline dividers between inactive tabs */
.cxg-tab + .cxg-tab::before{
  content:"";
  position:absolute;left:-1px;top:22%;bottom:22%;
  width:1px;background:#e8e1f7;
  transition:opacity .22s ease;
}
.cxg-tab.is-active::before,
.cxg-tab.is-active + .cxg-tab::before{opacity:0}

.cxg-tab-ic{
  display:grid;place-items:center;
  color:#7c3aed;
}
.cxg-tab-ic svg{width:clamp(17px, 4.6cqw, 21px);height:clamp(17px, 4.6cqw, 21px)}
.cxg-tab-tx{
  font-size:12px;
  font-weight:600;
  letter-spacing:-.005em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:100%;
}
.cxg-tab-ul{
  display:block;
  width:0;height:2px;border-radius:2px;
  background:#fff;
  transition:width .22s ease, background .22s ease;
}

.cxg-tab.is-active{
  background:linear-gradient(135deg,#8b5cf6 0%,#6d28d9 55%,#5b21b6 100%);
  color:#fff;
  box-shadow:0 12px 26px -10px rgba(91,33,182,.75);
}
.cxg-tab.is-active .cxg-tab-ic{color:#fff}
.cxg-tab.is-active .cxg-tab-ul{width:22px;background:#fff}

.cxg-tab:hover:not(.is-active){
  background:rgba(237,233,254,.85);
  color:#5b21b6;
}
.cxg-tab:focus-visible{
  outline:none;
  box-shadow:0 0 0 3px rgba(124,58,237,.35);
}

/* ---------- center pills ---------- */
.cxg-pills{
  position:relative;z-index:3;
  display:flex;flex-direction:column;align-items:center;
  gap:6px;
  margin-top:12px;
  padding-bottom:4px;
}
.cxg-devpill,
.cxg-okpill{
  display:inline-flex;align-items:center;
  gap:clamp(5px, 1.4cqw, 7px);
  white-space:nowrap;
  border-radius:999px;
  font-weight:700;
}
.cxg-devpill{
  height:clamp(28px, 7.6cqw, 34px);
  padding:0 clamp(8px, 2.4cqw, 12px);
  background:rgba(255,255,255,.62);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 8px 22px rgba(124,58,237,.14), inset 0 1px 0 rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(14px) saturate(170%);
  backdrop-filter:blur(14px) saturate(170%);
  color:#2a2340;
  font-size:clamp(10px, 2.85cqw, 12px);
}
.cxg-devpill svg{
  width:clamp(13px, 3.6cqw, 17px);
  height:clamp(13px, 3.6cqw, 17px);
  color:#6d28d9;flex:none;
}
.cxg-devpill .cxg-sep{
  pointer-events:none;height:14px}

.cxg-okpill{
  height:clamp(24px, 6.6cqw, 29px);
  padding:0 clamp(8px, 2.4cqw, 12px);
  background:#dcfce7;
  border:1px solid #b9f3cd;
  color:#15803d;
  font-size:clamp(9px, 2.55cqw, 10.5px);
  font-weight:600;
}
.cxg-okpill svg{width:clamp(12px, 3.3cqw, 15px);height:clamp(12px, 3.3cqw, 15px);flex:none}

/* ---------- motion ---------- */
@media (min-width:1024px) and (hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference){
  /* .cxg-live sirf tab lagti hai jab card screen par ho (IntersectionObserver) —
     scroll kar ke aage jaane par animation khud band, CPU 0 */
  .cxg-card.cxg-live .cxg-chip{animation:cxg-float 4.6s ease-in-out infinite;will-change:transform}
  .cxg-row-top .cxg-chip:nth-child(1){animation-delay:0s}
  .cxg-row-top .cxg-chip:nth-child(2){animation-delay:-1.1s}
  .cxg-row-bot .cxg-chip:nth-child(1){animation-delay:-2.2s}
  .cxg-row-bot .cxg-chip:nth-child(2){animation-delay:-3.3s}
  @keyframes cxg-float{
    0%,100%{transform:translateY(-4px)}
    50%    {transform:translateY(4px)}
  }
  .cxg-card.cxg-live .cxg-art{animation:cxg-breathe 6s ease-in-out infinite}
  @keyframes cxg-breathe{
    0%,100%{transform:translateY(0) scale(1)}
    50%    {transform:translateY(-4px) scale(1.012)}
  }
}
/* ---------- MOBILE / TOUCH: zero animation, zero blur, zero filter ---------- */
@media (max-width:1023px), (hover:none), (pointer:coarse){
  .cxg-card *,
  .cxg-card{
    animation:none !important;
    transition:none !important;
    will-change:auto !important;
  }
  /* backdrop-filter mobile GPUs par sab se mehnga — wahan flat fill */
  .cxg-chip,
  .cxg-devpill,
  .cxg-tabs{
    -webkit-backdrop-filter:none !important;
    backdrop-filter:none !important;
  }
  .cxg-chip{background:rgba(255,255,255,.86)}
  .cxg-devpill{background:rgba(255,255,255,.9)}
  .cxg-tabs{background:rgba(255,255,255,.92)}
  .cxg-art{filter:none}
  .cxg-chip:hover,
  .cxg-chip:focus-visible{transform:none}
}
@media (prefers-reduced-motion:reduce){
  .cxg-card *{animation:none !important;transition:none !important}
}

/* ---------- responsive: < 480px → chips chhup jayein ---------- */
@media (max-width:479px){
  .cxg-card{max-width:100%;margin:0 auto;padding:14px;border-radius:22px}
  .cxg-row{display:none}
  .cxg-wires{display:none}
  .cxg-mid{padding:14px 0 6px}
  .cxg-art{width:190px}
  .cxg-pills{margin:10px auto 0}
  .cxg-tabs{margin-top:10px}
  .cxg-tab-tx{display:none}          /* icons only */
  .cxg-tab{padding:10px 4px;min-height:44px}
  .cxg-tab-ul{display:none}
  .cxg-tab + .cxg-tab::before{top:26%;bottom:26%}
}

/* ---------- container queries: narrow card → pills stack tighter ---------- */
@container (max-width: 420px){
  .cxg-lb{font-size:11px}
  .cxg-devpill{font-size:10.5px}
  .cxg-okpill{font-size:9.5px}
}

<script>
/* Auto-rotate the active tab every 3s — pause on hover/focus, off for reduced motion */
(function () {
  var bar = document.querySelector('.cxg-tabs[data-rotate]');
  if (!bar) return;

  var tabs   = Array.prototype.slice.call(bar.querySelectorAll('.cxg-tab'));
  var chips  = Array.prototype.slice.call(document.querySelectorAll('.cxg-chip'));
  var card   = bar.closest('.cxg-card');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* mobile par rotation bilkul nahi — battery/CPU bachao */
  var isDesktop = window.matchMedia('(min-width:1024px) and (hover:hover) and (pointer:fine)').matches;
  var i = tabs.findIndex(function (t) { return t.classList.contains('is-active'); });
  if (i < 0) i = 0;
  var timer = null;
  var paused = false;

  function paint() {
    tabs.forEach(function (t, n) {
      t.classList.toggle('is-active', n === i);
      t.setAttribute('aria-current', n === i ? 'true' : 'false');
    });
    var tool = tabs[i].getAttribute('data-tool');
    chips.forEach(function (c) {
      c.classList.toggle('is-lit', c.getAttribute('data-tool') === tool);
    });
  }

  function tick() {
    if (paused) return;
    i = (i + 1) % tabs.length;
    paint();
  }

  function start() {
    if (reduce || !isDesktop || timer) return;
    timer = setInterval(tick, 3000);
  }
  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
  }
  function pause() { paused = true; stop(); }
  function resume() { paused = false; paint(); start(); }

  bar.addEventListener('mouseenter', pause);
  bar.addEventListener('mouseleave', resume);
  bar.addEventListener('focusin', pause);
  bar.addEventListener('focusout', resume);

  tabs.forEach(function (t, n) {
    t.addEventListener('click', function (e) {
      e.preventDefault(); // allow demo clicks in preview
      i = n;
      paint();
    });
  });

  /* mobile par kuch bhi nahi — bas pehla tab active */
  if (!isDesktop || reduce) { paint(); return; }

  /* card hover bhi pause kare (poora card dekhte waqt tab na badle) */
  if (card) {
    card.addEventListener('mouseenter', function () { paused = true; });
    card.addEventListener('mouseleave', function () { paused = false; });

    /* viewport se bahar ho to timer band — battery */
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          /* viewport mein hai? tab hi animation aur timer chalein */
          card.classList.toggle('cxg-live', e.isIntersecting);
          e.isIntersecting ? start() : stop();
        });
      }, { threshold: 0.15 }).observe(card);
    } else {
      card.classList.add('cxg-live');
      start();
    }
  }

  paint();
})();
</script>
