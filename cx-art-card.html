<style>
/* ==========================================================================
   Compixor — Hero SVG Art Card  ·  v2 (richer palette)
   File: cx-art-card.css
   Scoped with .cx- prefix. No deps, no webfonts, no images.

   MOBILE  → 100% static (koi animation nahi)
   DESKTOP → halki float/rotate/glow + hover lift (sirf mouse + >=1024px)
   ========================================================================== */

.cx-art-card{
  position:relative;
  width:100%;
  max-width:470px;
  margin-left:auto;
  background:#fff;
  border:1px solid #ecdcff;
  border-radius:22px;
  overflow:hidden;
  box-shadow:
    0 24px 60px -34px rgba(88,28,190,.45),
    0 2px 6px rgba(60,36,120,.05);
}
.cx-art-card svg{display:block;width:100%;height:auto}

/* top accent bar — instant color pop */
.cx-art-card::before{
  content:"";
  position:absolute;top:0;left:0;right:0;height:4px;z-index:2;
  background:linear-gradient(90deg,#8b5cf6 0%,#d946ef 52%,#f43f5e 100%);
}

/* ---------- footer tool strip ---------- */
.cx-art-foot{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:1px;
  background:#f3ecfd;
  border-top:1px solid #f3ecfd;
}
.cx-art-foot > div{padding:11px 6px 12px;text-align:center;background:#fdfbff}
.cx-art-foot .cx-ft-ic{
  width:28px;height:28px;margin:0 auto 6px;border-radius:9px;
  display:grid;place-items:center;border:1px solid transparent;
}
.cx-art-foot b{
  display:block;font-size:9.5px;font-weight:800;letter-spacing:.03em;
  text-transform:uppercase;color:#3b3348;line-height:1.25;
}
.cx-ft-compress{background:#f3e9ff;border-color:#e3d0ff}
.cx-ft-water{background:#ffe4ec;border-color:#ffcadb}
.cx-ft-protect{background:#ece5ff;border-color:#dbcdff}
.cx-ft-qr{background:#e3edfb;border-color:#cbdcf5}

/* ---------- default = STATIC (mobile-first) ---------- */
.cx-anim{animation:none}

/* ---------- hover lift: sirf mouse wale devices ---------- */
@media (hover:hover) and (pointer:fine){
  .cx-art-card{transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s}
  .cx-art-card:hover{
    transform:translateY(-3px);
    box-shadow:
      0 34px 70px -34px rgba(88,28,190,.55),
      0 2px 8px rgba(60,36,120,.06);
  }
}

/* ---------- DESKTOP ONLY: animation ---------- */
@media (min-width:1024px) and (hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference){

  .cx-ring{transform-box:view-box;transform-origin:50% 50%}
  .cx-chip{transform-box:fill-box}
  .cx-glow{transform-box:fill-box;transform-origin:50% 50%}
  .cx-spark{transform-box:fill-box;transform-origin:50% 50%}

  /* 1) dashed ring — slow rotate */
  .cx-ring.cx-anim{animation:cx-spin 52s linear infinite}
  @keyframes cx-spin{to{transform:rotate(360deg)}}

  /* 2) shield glow — opacity + scale */
  .cx-glow.cx-anim{
    animation:cx-glow 3.8s ease-in-out infinite;
    will-change:transform,opacity;
  }
  @keyframes cx-glow{
    0%,100%{opacity:.30;transform:scale(.94)}
    50%    {opacity:.55;transform:scale(1.10)}
  }

  /* 3) chips — sirf translateY */
  .cx-chip.cx-anim{animation:cx-float 7s ease-in-out infinite;will-change:transform}
  .cx-f1{animation-delay:-.2s}
  .cx-f2{animation-delay:-2.1s;animation-duration:8.2s}
  .cx-f3{animation-delay:-3.4s;animation-duration:7.6s}
  .cx-f4{animation-delay:-1.2s;animation-duration:9s}
  .cx-f5{animation-delay:-4.2s;animation-duration:8.6s}
  .cx-f6{animation-delay:-2.8s;animation-duration:7.2s}
  @keyframes cx-float{
    0%,100%{transform:translateY(0)}
    50%    {transform:translateY(-7px)}
  }

  /* 4) sparkles — twinkle */
  .cx-spark.cx-anim{animation:cx-twinkle 3.4s ease-in-out infinite}
  .cx-sp2{animation-delay:1.7s;animation-duration:4.2s}
  @keyframes cx-twinkle{
    0%,100%{opacity:.35;transform:scale(.85)}
    50%    {opacity:1;transform:scale(1.08)}
  }

  /* 5) badge — halki breathing */
  .cx-badge.cx-anim{animation:cx-badge 5s ease-in-out infinite}
  @keyframes cx-badge{0%,100%{opacity:1}50%{opacity:.78}}
}

/* ---------- viewport se bahar ho to pause ---------- */
.cx-art-card.cx-paused *{animation-play-state:paused !important}

/* ---------- accessibility safety net ---------- */
@media (prefers-reduced-motion:reduce){
  .cx-art-card *{animation:none !important;transition:none !important}
}

/* ---------- mobile spacing ---------- */
@media (max-width:640px){
  .cx-art-card{margin:0 auto;border-radius:18px}
  .cx-art-foot > div{padding:10px 4px 11px}
  .cx-art-foot b{font-size:8.5px}
  .cx-art-foot .cx-ft-ic{width:26px;height:26px}
}
</style>

<script>
/* Sirf ek kaam: card viewport se bahar ho to animation pause (battery) */
(function(){
  var card = document.getElementById('cxArtCard');
  if(!card || !('IntersectionObserver' in window)) return;
  new IntersectionObserver(function(entries){
    entries.forEach(function(e){ card.classList.toggle('cx-paused', !e.isIntersecting); });
  },{threshold:.05}).observe(card);
})();
</script>
