version: '3.8'

services:
  background-remover:
    build: .
    container_name: rembg-flask-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - GUNICORN_WORKERS=2
      - GUNICORN_THREADS=4
      - GUNICORN_TIMEOUT=120
    volumes:
      - rembg_models:/root/.u2net

volumes:
  rembg_models:
